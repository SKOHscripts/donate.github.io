<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="theme-color" content="#282c34" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Support SKOHscripts' open source work with GitHub Sponsors, Bitcoin, Monero or Zcash." />
  <title>Fuel the code</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2361afef'/%3E%3Cstop offset='1' stop-color='%23c678dd'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M8 13h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6zM21 14h1.5a3 3 0 0 1 0 6H20.5' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script src="qrcode.js"></script>
  <style>
    :root {
      /* One Dark palette */
      --od-bg:      #282c34;
      --od-bg-dark: #21252b;
      --od-bg-deep: #1e2127;
      --od-line:    #2c313a;
      --od-gutter:  #4b5263;
      --od-comment: #5c6370;
      --od-fg:      #abb2bf;
      --od-red:     #e06c75;
      --od-green:   #98c379;
      --od-yellow:  #e5c07b;
      --od-blue:    #61afef;
      --od-purple:  #c678dd;
      --od-cyan:    #56b6c2;
      --od-orange:  #d19a66;

      /* UI tokens */
      --text-1: #eef0f4;
      --text-2: #abb2bf;
      --text-3: #7f848e;
      --card-bg: rgba(33, 37, 43, 0.74);
      --card-border: rgba(255, 255, 255, 0.09);
      --cell-bg: rgba(255, 255, 255, 0.05);
      --cell-border: rgba(255, 255, 255, 0.06);
      --seg-bg: rgba(118, 118, 128, 0.20);
      --seg-thumb: rgba(99, 104, 116, 0.85);
      --accent: #f7931a;

      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, "Liberation Mono", monospace;
      --ease: cubic-bezier(.32, .72, 0, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--od-bg);
      color: var(--text-1);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* ---------- Background: scrolling abstract code ---------- */
    #code-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .bg-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 55% at 50% 50%, rgba(40, 44, 52, 0.55) 0%, rgba(40, 44, 52, 0) 70%),
        linear-gradient(to bottom, var(--od-bg) 0%, rgba(40, 44, 52, 0) 16%, rgba(40, 44, 52, 0) 84%, var(--od-bg) 100%);
    }

    /* ---------- Layout ---------- */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: max(28px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      max-width: 412px;
      background: var(--card-bg);
      -webkit-backdrop-filter: blur(28px) saturate(170%);
      backdrop-filter: blur(28px) saturate(170%);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 30px 80px -20px rgba(0, 0, 0, 0.65),
        0 12px 24px -12px rgba(0, 0, 0, 0.5);
      padding: 26px 20px 20px;
    }

    /* ---------- Header ---------- */
    .header { text-align: center; }

    .app-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: linear-gradient(140deg, var(--od-blue) 0%, var(--od-purple) 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px -8px rgba(198, 120, 221, 0.55), 0 1px 0 rgba(255, 255, 255, 0.25) inset;
    }
    .app-icon svg { width: 34px; height: 34px; overflow: visible; }
    .steam { animation: steam 2.6s ease-in-out infinite; transform-origin: center bottom; }
    .steam:nth-of-type(2) { animation-delay: .5s; }
    @keyframes steam {
      0%, 100% { opacity: .35; transform: translateY(1px); }
      50%      { opacity: 1;   transform: translateY(-1.5px); }
    }

    .path {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-3);
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid var(--cell-border);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .path .p-user { color: var(--od-green); }
    .path .p-dir  { color: var(--od-blue); }
    .caret {
      display: inline-block;
      width: 7px;
      height: 13px;
      background: var(--od-blue);
      border-radius: 1px;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-1);
    }
    .subtitle {
      margin: 0 auto;
      max-width: 330px;
      font-size: 15px;
      line-height: 1.4;
      color: var(--text-2);
    }

    /* ---------- Segmented controls ---------- */
    .segmented {
      --n: 4;
      --i: 0;
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--n), 1fr);
      padding: 2px;
      border-radius: 11px;
      background: var(--seg-bg);
      margin-top: 22px;
    }
    .segmented::before {
      content: "";
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 2px;
      width: calc((100% - 4px) / var(--n));
      transform: translateX(calc(var(--i) * 100%));
      border-radius: 9px;
      background: var(--seg-thumb);
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25), 0 3px 1px rgba(0, 0, 0, 0.08);
      transition: transform .35s var(--ease);
    }
    .seg {
      position: relative;
      z-index: 1;
      appearance: none;
      border: 0;
      background: none;
      color: var(--text-2);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      height: 34px;
      padding: 0 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border-radius: 9px;
      white-space: nowrap;
      transition: color .2s ease;
    }
    .seg svg { width: 16px; height: 16px; flex: none; }
    .seg[aria-selected="true"] { color: var(--text-1); }
    .seg:focus-visible { outline: 2px solid var(--od-blue); outline-offset: 1px; }

    .segmented.small { margin-top: 0; border-radius: 10px; }
    .segmented.small::before { border-radius: 8px; }
    .segmented.small .seg { height: 30px; font-size: 12.5px; font-weight: 500; }
    .segmented.small .seg[aria-selected="true"] { font-weight: 600; }

    /* collapsible row for the Bitcoin sub-control */
    .sub-wrap {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows .35s var(--ease), opacity .25s ease;
    }
    .sub-wrap.open { grid-template-rows: 1fr; opacity: 1; }
    .sub-wrap > div { overflow: hidden; }
    .sub-wrap .segmented { margin-top: 10px; }

    /* ---------- Method panel ---------- */
    .panel {
      margin-top: 20px;
      transition: opacity .16s ease, transform .16s ease;
      touch-action: pan-y;
    }
    .panel.switching { opacity: 0; transform: translateY(6px); }

    .qr-frame {
      position: relative;
      width: 212px;
      margin: 0 auto;
      padding: 12px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent), 0 18px 40px -16px rgba(0, 0, 0, 0.6);
      transition: box-shadow .3s ease;
    }
    #qr {
      display: block;
      width: 188px;
      height: 188px;
      image-rendering: pixelated;
    }
    .qr-badge {
      position: absolute;
      left: 50%;
      bottom: -14px;
      transform: translateX(-50%);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--od-bg-dark);
      border: 3px solid var(--od-bg-dark);
      display: grid;
      place-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }
    .qr-badge svg { width: 24px; height: 24px; }

    .method-head {
      text-align: center;
      margin-top: 24px;
    }
    .method-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .tag {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      padding: 3px 9px;
      border-radius: 999px;
    }
    .note {
      margin: 10px auto 0;
      max-width: 340px;
      text-align: center;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--text-2);
    }

    /* address cell (iOS grouped list row) */
    .cell {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 10px 12px 14px;
      background: var(--cell-bg);
      border: 1px solid var(--cell-border);
      border-radius: 16px;
      text-align: left;
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: background .15s ease, transform .1s ease;
    }
    .cell:hover { background: rgba(255, 255, 255, 0.075); }
    .cell:active { transform: scale(0.99); }
    .cell:focus-visible { outline: 2px solid var(--od-blue); outline-offset: 2px; }
    .cell-body { flex: 1; min-width: 0; }
    .cell-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 4px;
    }
    .addr {
      display: block;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-3);
      word-break: break-all;
    }
    .addr .hl { color: var(--text-1); font-weight: 600; }
    .copy-ico {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .copy-ico svg { width: 18px; height: 18px; }

    /* buttons */
    .actions { margin-top: 12px; }
    .btn {
      appearance: none;
      border: 0;
      width: 100%;
      height: 50px;
      border-radius: 14px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      color: var(--od-bg-deep);
      background: var(--accent);
      box-shadow: 0 10px 24px -12px var(--accent);
      transition: filter .15s ease, transform .1s ease, background .3s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.985); }
    .btn:focus-visible { outline: 2px solid var(--text-1); outline-offset: 2px; }
    .btn svg { width: 18px; height: 18px; }

    .learn {
      display: block;
      width: fit-content;
      margin: 12px auto 0;
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      opacity: .9;
    }
    .learn:hover { text-decoration: underline; opacity: 1; }
    .learn[hidden] { display: none; }

    .thanks {
      margin: 20px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--cell-border);
      text-align: center;
      font-size: 13px;
      color: var(--text-3);
    }
    .thanks .heart { color: var(--od-red); display: inline-block; animation: beat 1.6s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } }

    .footer {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-3);
    }
    .footer a { color: var(--text-2); text-decoration: none; }
    .footer a:hover { color: var(--od-blue); }
    .footer .kw { color: var(--od-purple); }

    /* toast (iOS HUD) */
    .toast {
      position: fixed;
      left: 50%;
      bottom: max(28px, env(safe-area-inset-bottom));
      z-index: 10;
      transform: translate(-50%, 16px) scale(.96);
      opacity: 0;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(50, 55, 64, 0.88);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      color: var(--text-1);
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      transition: opacity .25s ease, transform .35s var(--ease);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
    .toast svg { width: 18px; height: 18px; color: var(--od-green); }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    @media (max-width: 440px) {
      .card { padding: 24px 16px 18px; }
      .seg { font-size: 12.5px; gap: 5px; padding: 0 2px; }
      .seg svg { width: 14px; height: 14px; }
      .segmented.small .seg svg { display: none; }
    }
    @media (max-width: 380px) {
      .card { padding: 22px 12px 16px; border-radius: 26px; }
      h1 { font-size: 25px; }
      .seg { font-size: 12px; gap: 4px; }
      .segmented.small .seg { font-size: 11.5px; }
    }
    @media (max-width: 350px) {
      .segmented:not(.small) .seg svg { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="code-bg" aria-hidden="true"></canvas>
  <div class="bg-vignette" aria-hidden="true"></div>

  <main class="page">
    <section class="card" aria-labelledby="title">
      <header class="header">
        <div class="app-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path class="steam" d="M9 2.8c-.9 1 .9 1.8 0 3.2" />
            <path class="steam" d="M12.6 2.8c-.9 1 .9 1.8 0 3.2" />
            <path d="M4.5 9h12v4.5a5.5 5.5 0 0 1-5.5 5.5h-1a5.5 5.5 0 0 1-5.5-5.5V9z" />
            <path d="M16.5 10.5h1.25a2.75 2.75 0 0 1 0 5.5H16" />
            <path d="M8.6 12.4 7.4 13.9l1.2 1.5M12.4 12.4l1.2 1.5-1.2 1.5" stroke-width="1.4" />
          </svg>
        </div>
        <div class="path" aria-hidden="true">
          <span class="p-user">skoh</span><span>:</span><span class="p-dir">~/donate</span><span class="caret"></span>
        </div>
        <h1 id="title">Fuel the code</h1>
        <p class="subtitle" id="subtitle"></p>
      </header>

      <div class="segmented" id="groupSeg" role="tablist" aria-label="Donation method"></div>

      <div class="sub-wrap" id="subWrap">
        <div>
          <div class="segmented small" id="subSeg" role="tablist" aria-label="Bitcoin option"></div>
        </div>
      </div>

      <div class="panel" id="panel" role="tabpanel" aria-live="polite">
        <div class="qr-frame">
          <canvas id="qr" width="188" height="188" role="img"></canvas>
          <div class="qr-badge" id="qrBadge" aria-hidden="true"></div>
        </div>

        <div class="method-head">
          <div class="method-title" id="methodTitle"></div>
          <span class="tag" id="methodTag"></span>
        </div>
        <p class="note" id="methodNote"></p>

        <button type="button" class="cell" id="addrCell">
          <span class="cell-body">
            <span class="cell-label" id="addrLabel"></span>
            <span class="addr" id="addr"></span>
          </span>
          <span class="copy-ico" id="copyIco" aria-hidden="true"></span>
        </button>

        <div class="actions">
          <a class="btn" id="openBtn" href="#" rel="noopener noreferrer"></a>
        </div>
        <a class="learn" id="learnLink" href="#" target="_blank" rel="noopener noreferrer"></a>
      </div>

      <p class="thanks"><span class="heart" aria-hidden="true">♥</span> <span id="thanks"></span></p>
    </section>

    <footer class="footer">
      <span class="kw">MIT</span> · <a href="https://github.com/SKOHscripts/donate.github.io" target="_blank" rel="noopener noreferrer">SKOHscripts/donate.github.io</a>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    'use strict';

    /* =====================================================================
       CONFIG — donation methods
         id:      unique id (also used as URL hash, e.g. #monero)
         group:   top-level tab it belongs to
         label:   name shown in the sub-tab (Bitcoin only) and as title
         address: text displayed and copied
         uri:     URI encoded in the QR code and opened by the main button
         learn:   optional "learn more" link
       ===================================================================== */
    const METHODS = [
      {
        id: 'sponsor', group: 'sponsor', label: 'GitHub Sponsors',
        address: 'github.com/sponsors/SKOHscripts',
        uri: 'https://github.com/sponsors/SKOHscripts'
      },
      {
        id: 'lightning', group: 'bitcoin', label: 'Lightning',
        address: 'skoh00@cake.cash',
        uri: 'lightning:skoh00@cake.cash',
        learn: 'https://lightning.network'
      },
      {
        id: 'silent', group: 'bitcoin', label: 'Silent Payments',
        address: 'sp1qq0mg6p8wgxk7455en0drdves9v9478u27wsx54xcm6tcjdr4ysuj6qc58j9c34s5rp036r8mz7zt7ec5epcnq7es9fn4nlnd0y5agl8u8q5s6l0e',
        uri: 'bitcoin:sp1qq0mg6p8wgxk7455en0drdves9v9478u27wsx54xcm6tcjdr4ysuj6qc58j9c34s5rp036r8mz7zt7ec5epcnq7es9fn4nlnd0y5agl8u8q5s6l0e',
        learn: 'https://silentpayments.xyz'
      },
      {
        id: 'onchain', group: 'bitcoin', label: 'On-chain',
        address: 'bc1qw4v8hgjye9fxueppjksert26vlsn6g78dstmzz',
        uri: 'bitcoin:bc1qw4v8hgjye9fxueppjksert26vlsn6g78dstmzz',
        learn: 'https://bitcoin.org'
      },
      {
        id: 'monero', group: 'monero', label: 'Monero',
        address: '84cMBDFd6XwW2ZwKs82tcJXmjTzsrHUiXW2bufkd9H3hDExzF1k2fLcHG1eXBULxLc5BZM7L1fMobPscZo5LMS8HUMHoJP8',
        uri: 'monero:84cMBDFd6XwW2ZwKs82tcJXmjTzsrHUiXW2bufkd9H3hDExzF1k2fLcHG1eXBULxLc5BZM7L1fMobPscZo5LMS8HUMHoJP8',
        learn: 'https://www.getmonero.org'
      },
      {
        id: 'zcash', group: 'zcash', label: 'Zcash',
        address: 'u1jfsx398440q6eawncqtnn398tanx0j3ga2t3m5yvlp9h5nulkwzkkqasgy7q23fday7pcvm3tkm4wuceq3uzca7zanfmf7cgy52j8tql',
        uri: 'zcash:u1jfsx398440q6eawncqtnn398tanx0j3ga2t3m5yvlp9h5nulkwzkkqasgy7q23fday7pcvm3tkm4wuceq3uzca7zanfmf7cgy52j8tql',
        learn: 'https://z.cash'
      }
    ];

    const GROUPS = [
      { id: 'sponsor', label: 'Sponsor', icon: 'heart',   accent: '#db61a2' },
      { id: 'bitcoin', label: 'Bitcoin', icon: 'bitcoin', accent: '#f7931a' },
      { id: 'monero',  label: 'Monero',  icon: 'monero',  accent: '#ff6600' },
      { id: 'zcash',   label: 'Zcash',   icon: 'zcash',   accent: '#f4b728' }
    ];

    const SUB_ICONS = { lightning: 'bolt', silent: 'shield', onchain: 'cube' };
    const ALLOWED_SCHEMES = ['https:', 'bitcoin:', 'lightning:', 'monero:', 'zcash:'];

    /* =====================================================================
       Localised strings
       ===================================================================== */

    function makeSeg(container, items, onPick) {

      const buttons = items.map((it, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'seg';
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-controls', 'panel');
        if (it.icon) {

        const span = document.createElement('span');
        span.textContent = it.label;
        b.appendChild(span);
        b.addEventListener('click', () => onPick(it, i));

          e.preventDefault();

    function drawQR(text) {
      const ctx = qrCanvas.getContext('2d');

        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        const cell = Math.max(1, Math.floor((188 * dpr) / n));
        const size = cell * n;
        qrCanvas.width = size;
        qrCanvas.height = size;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#1e2127';
        for (let r = 0; r < n; r++) {

        }

        qrCanvas.width = 188; qrCanvas.height = 188;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 188, 188);

      tx = e.touches[0].clientX;
      ty = e.touches[0].clientY;
    }, { passive: true });
    panel.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - tx, dy = t.clientY - ty;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) step(dx < 0 ? 1 : -1);
    }, { passive: true });

    window.addEventListener('hashchange', () => {
      const m = METHODS.find(x => '#' + x.id === location.hash);
      if (m && m !== current) select(m);
    });

    // initial method from URL hash (#lightning, #monero, …)
    const fromHash = METHODS.find(x => '#' + x.id === location.hash);
    current = fromHash || METHODS[0];
    lastInGroup[current.group] = current;
    render(current);

    window.addEventListener('pageshow', (e) => { if (e.persisted) render(current); });

    /* =====================================================================
       Background: abstract code scrolling in One Dark colours.
       Pure shapes — no readable text. Paused when reduced motion is set.
       ===================================================================== */
    (function codeBackground() {
      const canvas = $('code-bg');
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const C = {
        keyword: '#c678dd', fn: '#61afef', string: '#98c379', type: '#e5c07b',
        variable: '#e06c75', op: '#56b6c2', number: '#d19a66', plain: '#abb2bf',
        comment: '#5c6370', gutter: '#4b5263'
      };
      const CHAR = 7.2;      // width of one "character"
      const LINE = 21;       // line height
      const BAR = 8;         // token bar height
      const GUTTER = 46;     // gutter width
      const LINES = 160;     // lines per pane before looping
      const PANE_W = 640;

      // deterministic PRNG so the layout is stable
      function rng(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6D2B79F5) >>> 0;
          let t = s;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function genLines(seed) {
        const r = rng(seed);
        const pick = (arr) => arr[Math.floor(r() * arr.length)];
        const len = (a, b) => a + Math.floor(r() * (b - a + 1));
        const out = [];
        let indent = 0;
        for (let i = 0; i < LINES; i++) {
          const roll = r();
          const tokens = [];
          let opens = false;

          if (roll < 0.10) {
            out.push({ indent, tokens });                       // blank line
            continue;
          }
          if (indent > 0 && roll < 0.24) {                       // closing brace
            indent--;
            tokens.push([1, C.plain]);
            const elseBranch = r() < 0.3;                        // "} else {"
            if (elseBranch) tokens.push([len(4, 7), C.keyword], [1, C.plain]);
            out.push({ indent, tokens });
            if (elseBranch) indent++;
            continue;
          }
          if (roll < 0.32) {                                     // comment
            tokens.push([2, C.comment], [len(10, 34), C.comment]);
            out.push({ indent, tokens });
            continue;
          }

          const shape = r();
          if (shape < 0.25 && indent < 4) {                      // function / block header
            tokens.push([pick([5, 6, 8]), C.keyword], [len(5, 14), C.fn], [1, C.plain]);
            const params = len(0, 3);
            for (let p = 0; p < params; p++) tokens.push([len(3, 8), C.variable], [1, C.plain]);
            tokens.push([1, C.plain]);
            opens = true;
          } else if (shape < 0.55) {                             // declaration
            tokens.push([pick([3, 5]), C.keyword], [len(4, 12), C.variable], [1, C.op]);
            const rhs = r();
            if (rhs < 0.35) tokens.push([len(8, 26), C.string]);
            else if (rhs < 0.55) tokens.push([len(1, 4), C.number]);
            else tokens.push([len(4, 9), C.type], [1, C.plain], [len(4, 10), C.fn], [2, C.plain]);
          } else if (shape < 0.80) {                             // call
            tokens.push([len(3, 8), C.variable], [1, C.plain], [len(4, 12), C.fn], [1, C.plain]);
            if (r() < 0.6) tokens.push([len(6, 20), C.string]);
            else tokens.push([len(2, 6), C.number]);
            tokens.push([2, C.plain]);
          } else if (indent < 4) {                               // if / for
            tokens.push([pick([2, 3, 5]), C.keyword], [1, C.plain], [len(3, 9), C.variable],
                        [pick([2, 3]), C.op], [len(1, 6), r() < 0.5 ? C.number : C.type], [1, C.plain], [1, C.plain]);
            opens = true;
          } else {                                               // return
            tokens.push([6, C.keyword], [len(4, 12), C.variable]);
          }
          out.push({ indent, tokens });
          if (opens) indent++;
        }
        return out;
      }

      let panes = [];
      let W = 0, H = 0, dpr = 1;
      const hasRoundRect = typeof ctx.roundRect === 'function';

      function setup() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.max(1, Math.ceil(W / PANE_W));
        const paneW = W / count;
        panes = [];
        for (let p = 0; p < count; p++) {
          panes.push({
            x: p * paneW,
            w: paneW,
            lines: genLines(1337 + p * 97),
            speed: 9 + p * 3.5 + (p % 2) * 2,       // px per second
            offset: p * 230
          });
        }
      }

      function bar(x, y, w) {
        if (hasRoundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, BAR, BAR / 2); ctx.fill(); }
        else ctx.fillRect(x, y, w, BAR);
      }

      function draw(t) {
        ctx.clearRect(0, 0, W, H);
        const total = LINES * LINE;
        for (const pane of panes) {
          const scroll = (pane.offset + (t / 1000) * pane.speed) % total;
          const first = Math.floor(scroll / LINE);
          const shift = scroll - first * LINE;
          const visible = Math.ceil(H / LINE) + 2;

          ctx.save();
          ctx.beginPath();
          ctx.rect(pane.x, 0, pane.w, H);
          ctx.clip();

          // split divider
          if (pane.x > 0) {
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#21252b';
            ctx.fillRect(pane.x, 0, 2, H);
          }

          for (let k = 0; k < visible; k++) {
            const idx = (first + k) % LINES;
            const line = pane.lines[idx];
            const y = k * LINE - shift + (LINE - BAR) / 2;

            // gutter: line-number dashes
            ctx.globalAlpha = 0.55;
            ctx.fillStyle = C.gutter;
            const digits = ((first + k) % 1000) > 99 ? 3 : (((first + k) % 1000) > 9 ? 2 : 1);
            bar(pane.x + GUTTER - 14 - digits * 5, y + 1, digits * 5);

            // indent guides
            ctx.globalAlpha = 0.18;
            for (let g = 0; g < line.indent; g++) {
              ctx.fillRect(pane.x + GUTTER + 8 + g * CHAR * 4, k * LINE - shift, 1, LINE);
            }

            // tokens
            let x = pane.x + GUTTER + 8 + line.indent * CHAR * 4;
            ctx.globalAlpha = 0.5;
            for (const [n, color] of line.tokens) {
              const w = n * CHAR - 2;
              ctx.fillStyle = color;
              bar(x, y, Math.max(w, 4));
              x += n * CHAR + CHAR;
              if (x > pane.x + pane.w - 12) break;
            }
          }
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }

      let raf = 0, last = 0;
      function loop(t) {
        raf = requestAnimationFrame(loop);
        if (t - last < 33) return;   // ~30 fps is plenty for a slow scroll
        last = t;
        draw(t);
      }

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { setup(); if (reduceMotion) draw(0); }, 120);
      });

      setup();
      if (reduceMotion) draw(0);
      else raf = requestAnimationFrame(loop);
    })();
  })();
  </script>
</body>
</html>
